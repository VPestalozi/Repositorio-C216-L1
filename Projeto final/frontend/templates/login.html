{% extends "base.html" %}
{% block title %}Login — Sistema de Biblioteca{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>📚 Sistema de Biblioteca</h1>
    <p class="subtitle">Faça login ou registre-se para continuar</p>

    <!-- Toggle buttons -->
    <div class="auth-toggle">
        <button id="btn-show-login" class="toggle-btn active" onclick="showLogin()">Login</button>
        <button id="btn-show-register" class="toggle-btn" onclick="showRegister()">Registro</button>
    </div>

    <!-- Mensagem de erro/sucesso -->
    <div id="auth-message" class="message hidden"></div>

    <!-- Formulário de Login -->
    <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label for="login-username">Usuário</label>
            <input type="text" id="login-username" placeholder="Digite seu usuário" required>
        </div>
        <div class="form-group">
            <label for="login-password">Senha</label>
            <input type="password" id="login-password" placeholder="Digite sua senha" required>
        </div>
        <button type="submit" class="btn btn-primary">Entrar</button>
    </form>

    <!-- Formulário de Registro -->
    <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
        <div class="form-group">
            <label for="reg-username">Usuário</label>
            <input type="text" id="reg-username" placeholder="Escolha um nome de usuário" required>
        </div>
        <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" placeholder="Digite seu email" required>
        </div>
        <div class="form-group">
            <label for="reg-password">Senha</label>
            <input type="password" id="reg-password" placeholder="Crie uma senha" required>
        </div>
        <button type="submit" class="btn btn-primary">Registrar</button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
